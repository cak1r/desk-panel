name: firmware

on:
  push:
    paths: ["main/**", "components/**", "test/host/**", "CMakeLists.txt", "sdkconfig*", "partitions.csv",
            "dependencies.lock", ".github/workflows/firmware.yml"]
  pull_request:
    paths: ["main/**", "components/**", "test/host/**", "CMakeLists.txt", "sdkconfig*", "partitions.csv",
            "dependencies.lock", ".github/workflows/firmware.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.4.4
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # The real headers are gitignored (credentials); the examples are
      # enough to compile.
      - name: Use example config headers
        run: |
          for f in wifi_credentials mqtt_config secrets_config; do
            cp main/$f.h.example main/$f.h
          done
      - name: Build
        run: |
          . $IDF_PATH/export.sh
          idf.py build
      - name: Host unit tests
        run: |
          . $IDF_PATH/export.sh
          make -C test/host
